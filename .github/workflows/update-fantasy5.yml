name: Update California Fantasy 5

on:
  schedule:
    # 11:30 Taiwan time (UTC+8) = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-california-fantasy5
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade truststore

      - name: Update California Fantasy 5
        run: python scripts/update.py --fantasy5

      - name: Commit updated data
        run: |
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update California Fantasy 5 results"
            git push
          fi
