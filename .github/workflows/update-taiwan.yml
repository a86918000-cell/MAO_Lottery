name: Update Taiwan Lotteries

on:
  schedule:
    # 20:50 Taiwan time (UTC+8) = 12:50 UTC
    - cron: "50 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-taiwan-lotteries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade truststore

      - name: Update 今彩539
        run: python scripts/update.py --539

      - name: Update 大樂透
        run: python scripts/update.py --lotto649

      - name: Commit updated data
        run: |
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Taiwan lottery results"
            git push
          fi
