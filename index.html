<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>開獎查詢</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="backBtn" class="back-btn" type="button" hidden aria-label="返回">← 返回</button>
      <div>
        <p class="eyebrow">簡單・清楚・好查詢</p>
        <h1 id="pageTitle">開獎查詢</h1>
      </div>
    </header>

    <section id="homeView">
      <p class="intro">請選擇要查詢的彩券</p>
      <div class="game-list">
        <button class="game-card" data-game="539">
          <span class="game-name">今彩 539</span><span class="game-action">查看開獎紀錄　›</span>
        </button>
        <button class="game-card" data-game="lotto649">
          <span class="game-name">大樂透</span><span class="game-action">查看開獎紀錄　›</span>
        </button>
        <button class="game-card" data-game="fantasy5">
          <span class="game-name">加州天天樂</span><span class="game-action">查看開獎紀錄　›</span>
        </button>
      </div>
      <p class="footnote">開獎資訊以各官方公告為準。</p>
    </section>

    <section id="resultView" hidden>
      <article class="latest-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">最新開獎</p>
            <h2 id="latestDate">資料載入中</h2>
          </div>
          <span id="latestPeriod" class="period"></span>
        </div>
        <div id="latestNumbers" class="number-row"></div>
        <button id="shareLatest" class="share-btn" type="button">分享最新一期圖片</button>
      </article>

      <section class="week-section">
        <div class="week-title">
          <h2>每週開獎紀錄</h2>
          <p id="weekRange"></p>
        </div>
        <div class="week-nav">
          <button id="prevWeek" type="button">‹ 上一週</button>
          <button id="nextWeek" type="button">下一週 ›</button>
        </div>
        <div id="weekList" class="week-list"></div>
        <button id="shareWeek" class="share-btn secondary" type="button">分享本週紀錄圖片</button>
      </section>
      <p id="updateInfo" class="footnote"></p>
      <p class="footnote">開獎資訊僅供查詢，請以官方公告為準。</p>
    </section>
  </main>
  <script src="js/lottery.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
